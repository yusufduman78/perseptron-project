<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Technical Change Tracker</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      background: #f7f7f5;
      color: #1f1f1f;
    }
    body {
      margin: 0;
      padding: 2rem;
    }
    main {
      max-width: 56rem;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.75rem;
      margin: 0 0 0.5rem;
    }
    p {
      margin: 0 0 1rem;
    }
    .panel {
      border: 1px solid #d7d7d2;
      border-radius: 8px;
      background: #ffffff;
      padding: 1rem;
    }
    code {
      background: #eeeeea;
      border-radius: 4px;
      padding: 0.1rem 0.25rem;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        background: #171717;
        color: #f2f2ee;
      }
      .panel {
        background: #202020;
        border-color: #3a3a37;
      }
      code {
        background: #2f2f2c;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Technical Change Tracker</h1>
    <p>Tracker initialized. Add JSON records under <code>changes/</code> as work progresses.</p>
    <section class="panel" aria-labelledby="state-flow">
      <h2 id="state-flow">State Flow</h2>
      <p><code>planned -> in_progress -> implemented -> tested -> deployed</code></p>
      <p><code>in_progress -> blocked -> in_progress</code></p>
    </section>
  </main>
</body>
</html>
