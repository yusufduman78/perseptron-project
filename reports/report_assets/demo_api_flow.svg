<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <rect width="1100" height="520" fill="#ffffff"/>
  <style>
    .box{fill:#f7f7f4;stroke:#222;stroke-width:2;rx:10}
    .api{fill:#eef6ff;stroke:#1b4e7a;stroke-width:2;rx:10}
    .out{fill:#fff4e8;stroke:#7a3b12;stroke-width:2;rx:10}
    .head{font:700 26px Arial, sans-serif;fill:#111}
    .txt{font:19px Arial, sans-serif;fill:#222}
    .small{font:16px Arial, sans-serif;fill:#444}
    .arrow{stroke:#222;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
  </defs>
  <text x="42" y="48" class="head">Demo Inference Flow</text>
  <rect x="40" y="100" width="250" height="120" class="box"/>
  <text x="70" y="145" class="txt">React frontend</text>
  <text x="70" y="177" class="small">scenario, style bag, profile</text>
  <rect x="400" y="100" width="270" height="120" class="api"/>
  <text x="430" y="145" class="txt">FastAPI backend</text>
  <text x="430" y="177" class="small">/api/recommend</text>
  <rect x="790" y="72" width="260" height="96" class="box"/>
  <text x="820" y="112" class="txt">V2 checkpoints</text>
  <text x="820" y="142" class="small">state_dict format</text>
  <rect x="790" y="205" width="260" height="96" class="box"/>
  <text x="820" y="245" class="txt">Data artifacts</text>
  <text x="820" y="275" class="small">metadata + embeddings</text>
  <rect x="400" y="315" width="270" height="120" class="api"/>
  <text x="430" y="360" class="txt">Three model scores</text>
  <text x="430" y="392" class="small">tabular, image-history, fusion</text>
  <rect x="40" y="315" width="250" height="120" class="out"/>
  <text x="70" y="360" class="txt">Marketplace UI</text>
  <text x="70" y="392" class="small">recommendations + insights</text>
  <path d="M290 160 L400 160" class="arrow"/>
  <path d="M670 142 L790 120" class="arrow"/>
  <path d="M670 178 L790 250" class="arrow"/>
  <path d="M535 220 L535 315" class="arrow"/>
  <path d="M400 375 L290 375" class="arrow"/>
</svg>
