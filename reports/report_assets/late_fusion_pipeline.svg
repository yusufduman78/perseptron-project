<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <rect width="1100" height="620" fill="#ffffff"/>
  <style>
    .box{fill:#f7f7f4;stroke:#222;stroke-width:2;rx:10}
    .head{font:700 26px Arial, sans-serif;fill:#111}
    .txt{font:19px Arial, sans-serif;fill:#222}
    .small{font:16px Arial, sans-serif;fill:#444}
    .arrow{stroke:#222;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
  </defs>
  <text x="42" y="48" class="head">Late Fusion Recommendation Pipeline</text>
  <rect x="40" y="88" width="260" height="110" class="box"/>
  <text x="64" y="128" class="txt">Customer metadata</text>
  <text x="64" y="158" class="small">age, FN, Active, membership</text>
  <rect x="40" y="230" width="260" height="110" class="box"/>
  <text x="64" y="270" class="txt">Article metadata</text>
  <text x="64" y="300" class="small">category, color, section</text>
  <rect x="40" y="372" width="260" height="110" class="box"/>
  <text x="64" y="412" class="txt">Product image</text>
  <text x="64" y="442" class="small">EfficientNet-B0 embedding</text>
  <rect x="390" y="132" width="260" height="130" class="box"/>
  <text x="420" y="178" class="txt">Tabular branch</text>
  <text x="420" y="210" class="small">numeric normalization</text>
  <text x="420" y="236" class="small">categorical embeddings</text>
  <rect x="390" y="330" width="260" height="150" class="box"/>
  <text x="420" y="376" class="txt">Visual branch</text>
  <text x="420" y="408" class="small">candidate embedding</text>
  <text x="420" y="434" class="small">customer visual profile</text>
  <text x="420" y="460" class="small">similarity + history count</text>
  <rect x="760" y="235" width="260" height="130" class="box"/>
  <text x="802" y="280" class="txt">Fusion head</text>
  <text x="802" y="312" class="small">concat latent vectors</text>
  <text x="802" y="338" class="small">purchase probability score</text>
  <path d="M300 143 L390 180" class="arrow"/>
  <path d="M300 285 L390 210" class="arrow"/>
  <path d="M300 427 L390 407" class="arrow"/>
  <path d="M650 197 L760 280" class="arrow"/>
  <path d="M650 405 L760 322" class="arrow"/>
  <text x="742" y="418" class="small">Same candidate pool is scored by</text>
  <text x="742" y="444" class="small">tabular_only, image_history and late_fusion.</text>
</svg>
